name: PR Docker Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      IMAGE_NAME: sbouhnik/myapp-pr-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Calculate new version
        working-directory: myapp
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          NEW_VERSION=$(echo "$CURRENT_VERSION" | awk -F. '{$NF = $NF + 1;} 1' | sed 's/ /./g')
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      - name: Update pom.xml version
        working-directory: myapp
        run: mvn versions:set -DnewVersion=${NEW_VERSION} -DgenerateBackupPoms=false

      - name: Commit updated pom.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add myapp/pom.xml
          git diff --cached --quiet || git commit -m "chore: bump version to ${NEW_VERSION}"
          git push origin HEAD:${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Build Docker image
        working-directory: myapp
        run: docker build -f DockerFile -t $IMAGE_NAME:${NEW_VERSION} .

      - name: Push Docker image
        run: docker push $IMAGE_NAME:${NEW_VERSION}
