name: PR Docker Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"

jobs:
  docker-build:
    if: github.event_name != 'pull_request' || github.event.sender.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      image-version: ${{ steps.image-version.outputs.image_version }}

    env:
      IMAGE_NAME: sbouhnik/myapp-pr-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image version
        id: image-version
        working-directory: myapp
        run: |
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            IMAGE_VERSION=$(echo "$CURRENT_VERSION" | awk -F. '{$NF = $NF + 1;} 1' | sed 's/ /./g')
          else
            IMAGE_VERSION=$CURRENT_VERSION
          fi
          echo "IMAGE_VERSION=$IMAGE_VERSION" >> "$GITHUB_ENV"
          echo "image_version=$IMAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update pom.xml version
        if: github.event_name == 'pull_request'
        working-directory: myapp
        run: mvn versions:set -DnewVersion=${IMAGE_VERSION} -DgenerateBackupPoms=false

      - name: Commit updated pom.xml
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add myapp/pom.xml
          git diff --cached --quiet || git commit -m "chore: bump version to ${IMAGE_VERSION} [skip ci]"
          git push origin HEAD:${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Build Docker image
        working-directory: myapp
        run: docker build -f DockerFile -t $IMAGE_NAME:${IMAGE_VERSION} .

      - name: Push Docker image
        run: docker push $IMAGE_NAME:${IMAGE_VERSION}

  docker-run:
    needs: docker-build
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: sbouhnik/myapp-pr-build
      IMAGE_VERSION: ${{ needs.docker-build.outputs.image-version }}

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull Docker image
        run: docker pull $IMAGE_NAME:${IMAGE_VERSION}

      - name: Run Docker image
        run: docker run --rm $IMAGE_NAME:${IMAGE_VERSION} "${{ github.actor }}"
